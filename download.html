  <script>
    /*
      One link for every bio: plesion.com/download
      - Works out where the visitor came from (the app's in-app browser, the referring site, or ?ref=…)
      - Sends iPhones/iPads to the App Store and Android phones to Google Play, passing the source on
        so the stores can report installs per platform
      - Computers and anything else stay on this page (badges + QR code)
      Nothing is stored and no request is made to any other service.
    */
    (function () {
      var APP_ID = '1502237943';
      var PACKAGE = 'com.vantino.plesion';
      // Apple only reports campaigns when your provider token is present: App Store Connect > App Analytics > Campaigns
      // (campaign link generator). Paste it between the quotes; until then App Store links carry no campaign.
      var APPLE_PROVIDER_TOKEN = '123825760';

      var ua = navigator.userAgent || '';

      function source() {
        var m = location.search.match(/[?&](?:ref|utm_source)=([a-z0-9_-]{1,30})/i);
        if (m) return m[1].toLowerCase();
        if (/Instagram/i.test(ua)) return 'instagram';
        if (/Barcelona/.test(ua)) return 'threads';
        if (/FBAN|FBAV|FB_IAB|FBIOS|FB4A/.test(ua)) return 'facebook';
        if (/musical_ly|BytedanceWebview|Bytedance|TikTok|trill_/i.test(ua)) return 'tiktok';
        if (/LinkedInApp/i.test(ua)) return 'linkedin';
        if (/Snapchat/i.test(ua)) return 'snapchat';
        if (/Twitter/i.test(ua)) return 'x';
        var r = '';
        try { r = new URL(document.referrer).hostname.replace(/^www\./, ''); } catch (e) {}
        if (/(^|\.)instagram\.com$/.test(r)) return 'instagram';
        if (/(^|\.)threads\.(net|com)$/.test(r)) return 'threads';
        if (/(^|\.)(facebook\.com|fb\.me)$/.test(r)) return 'facebook';
        if (/(^|\.)tiktok\.com$/.test(r)) return 'tiktok';
        if (/(^|\.)(linkedin\.com|lnkd\.in)$/.test(r)) return 'linkedin';
        if (/(^|\.)(x\.com|twitter\.com|t\.co)$/.test(r)) return 'x';
        if (/(^|\.)medium\.com$/.test(r)) return 'medium';
        if (/(^|\.)plesion\.com$/.test(r)) return 'website';
        return r ? r.replace(/[^a-z0-9.-]/gi, '').slice(0, 30) : 'direct';
      }

      var src = source();
      var medium = /^(direct|website)$/.test(src) ? src : 'social';
      var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);

      var appStore = 'https://apps.apple.com/app/apple-store/id' + APP_ID +
        (APPLE_PROVIDER_TOKEN ? '?pt=' + APPLE_PROVIDER_TOKEN + '&ct=' + encodeURIComponent(src) + '&mt=8' : '');
      var referrer = encodeURIComponent('utm_source=' + src + '&utm_medium=' + medium + '&utm_campaign=download');
      var playWeb = 'https://play.google.com/store/apps/details?id=' + PACKAGE + '&referrer=' + referrer;

      // Same tagged store links for the badges on this page
      window.__plesionStores = { appStore: appStore, play: playWeb };

      // Optional click counting: if an analytics script (e.g. Plausible) is added to the site later, report the source
      try { if (window.plausible) window.plausible('Download', { props: { source: src, device: isIOS ? 'ios' : isAndroid ? 'android' : 'other' } }); } catch (e) {}

      if (isIOS) { location.replace(appStore); return; }
      if (isAndroid) { location.replace(playWeb); return; }
    })();
  </script>
